services:
  mongodb:
    image: mongo:8
    container_name: loansphere-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-rootroot}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loansphere-net

  mongo-express:
    image: mongo-express:latest
    container_name: loansphere-mongo-express
    restart: unless-stopped
    ports:
      - "8089:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_PASSWORD:-rootroot}
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loansphere-net

  redis:
    image: redis:7-alpine
    container_name: loansphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-rootroot}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rootroot}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loansphere-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: loansphere-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - loansphere-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: loansphere-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - loansphere-net

  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    container_name: loansphere-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - loansphere-net

  config-server:
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile
    container_name: loansphere-config
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - loansphere-net

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: loansphere-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rootroot}
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loansphere-net

  authentication-service:
    build:
      context: ./backend/authentication-service
      dockerfile: Dockerfile
    container_name: loansphere-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/auth_db?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rootroot}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loansphere-net

  customer-profile-service:
    build:
      context: ./backend/customer-profile-service
      dockerfile: Dockerfile
    container_name: loansphere-customer
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/customer_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loansphere-net

  loan-offer-service:
    build:
      context: ./backend/loan-offer-service
      dockerfile: Dockerfile
    container_name: loansphere-offer
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/offer_db?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rootroot}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loansphere-net

  emi-calculation-service:
    build:
      context: ./backend/emi-calculation-service
      dockerfile: Dockerfile
    container_name: loansphere-emi
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/offer_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    networks:
      - loansphere-net

  loan-application-service:
    build:
      context: ./backend/loan-application-service
      dockerfile: Dockerfile
    container_name: loansphere-application
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/application_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loansphere-net

  loan-processing-service:
    build:
      context: ./backend/loan-processing-service
      dockerfile: Dockerfile
    container_name: loansphere-processing
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/processing_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loansphere-net

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: loansphere-notification
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/notification_db?authSource=admin
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loansphere-net

  document-service:
    build:
      context: ./backend/document-service
      dockerfile: Dockerfile
    container_name: loansphere-document
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:rootroot@mongodb:27017/document_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - loansphere-net

  ui-loan-portal:
    image: node:22-alpine
    container_name: loansphere-ui-portal
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./ui/loan-portal:/app
    command: sh -c "npm install --include=dev && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      - api-gateway
    networks:
      - loansphere-net

  ui-admin-console:
    image: node:22-alpine
    container_name: loansphere-admin-console
    restart: unless-stopped
    ports:
      - "5174:5174"
    working_dir: /app
    volumes:
      - ./ui/admin-console:/app
    command: sh -c "npm install --include=dev && npx vite --host 0.0.0.0 --port 5174"
    depends_on:
      - api-gateway
    networks:
      - loansphere-net

volumes:
  mongo_data:
  redis_data:

networks:
  loansphere-net:
    driver: bridge
