spring:
  application:
    name: loan-offer-service
  threads:
    virtual:
      enabled: true
  data:

jwt:
  secret: loansphere-docker-secret-key-must-be-at-least-256-bits-long
  expiration-ms: 3600000

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      customerProfileService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      customerProfileService:
        max-attempts: 3
        wait-duration: 500ms
management.endpoint.health.show-details: always
management:
  server:
    port: 9086
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
