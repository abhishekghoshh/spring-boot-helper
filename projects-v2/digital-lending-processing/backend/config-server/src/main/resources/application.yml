spring:
  application:
    name: config-server
  profiles:
    active: native
  threads:
    virtual:
      enabled: true
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

server:
  port: 8888

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
