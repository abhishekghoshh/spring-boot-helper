server { listen 80; server_name localhost; root /usr/share/nginx/html; index index.html; location / { try_files $uri $uri/ /index.html; } location /api/auth/ { proxy_pass http://identity-service:8081; } location /api/catalog/ { proxy_pass http://catalog-service:8082; } location /api/cart/ { proxy_pass http://cart-service:8083; } location /api/orders/ { proxy_pass http://order-service:8085; } }
