services:
  # ============================================
  # Infrastructure
  # ============================================

  mongodb:
    image: mongo:8
    container_name: cs-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootroot}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-commercesphere}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cs-network

  mongo-express:
    image: mongo-express:latest
    container_name: cs-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-rootroot}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootroot}@mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cs-network

  redis:
    image: redis:7-alpine
    container_name: cs-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-rootroot}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rootroot}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cs-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: cs-redis-insight
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cs-network

  # ============================================
  # Microservices
  # ============================================

  identity-service:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile
    container_name: cs-identity-service
    environment:
      - IDENTITY_SERVICE_PORT=8081
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-root}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-rootroot}
      - MONGO_DATABASE=${MONGO_DATABASE:-commercesphere}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rootroot}
      - JWT_SECRET=${JWT_SECRET:-commerce-sphere-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256}
    ports:
      - "8082:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  catalog-service:
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    container_name: cs-catalog-service
    environment:
      - CATALOG_SERVICE_PORT=8082
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-root}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-rootroot}
      - MONGO_DATABASE=${MONGO_DATABASE:-commercesphere}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rootroot}
    ports:
      - "8083:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  cart-service:
    build:
      context: ./backend/cart-service
      dockerfile: Dockerfile
    container_name: cs-cart-service
    environment:
      - CART_SERVICE_PORT=8083
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-root}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-rootroot}
      - MONGO_DATABASE=${MONGO_DATABASE:-commercesphere}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rootroot}
    ports:
      - "8084:8083"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  inventory-service:
    build:
      context: ./backend/inventory-service
      dockerfile: Dockerfile
    container_name: cs-inventory-service
    environment:
      - INVENTORY_SERVICE_PORT=8084
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-root}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-rootroot}
      - MONGO_DATABASE=${MONGO_DATABASE:-commercesphere}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rootroot}
    ports:
      - "8085:8084"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: cs-order-service
    environment:
      - ORDER_SERVICE_PORT=8085
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-root}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-rootroot}
      - MONGO_DATABASE=${MONGO_DATABASE:-commercesphere}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rootroot}
      - CART_SERVICE_URL=http://cart-service:8083
      - INVENTORY_SERVICE_URL=http://inventory-service:8084
    ports:
      - "8086:8085"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  # ============================================
  # Frontend
  # ============================================

  ui-admin-console:
    build:
      context: ./ui/admin-console
      dockerfile: Dockerfile
    container_name: cs-admin-console
    ports:
      - "3000:80"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - inventory-service
      - order-service
    networks:
      - cs-network

  ui-storefront:
    build:
      context: ./ui/storefront
      dockerfile: Dockerfile
    container_name: cs-storefront
    ports:
      - "3001:80"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service
    networks:
      - cs-network

networks:
  cs-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
