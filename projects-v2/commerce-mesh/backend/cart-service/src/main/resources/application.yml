server:
  port: ${CART_SERVICE_PORT:8084}

spring:
  threads:
    virtual:
      enabled: true
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  application:
    name: cart-service
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: 27017
      authentication-database: admin
      username: ${MONGO_ROOT_USER:root}
      password: ${MONGO_ROOT_PASSWORD:rootroot}
      database: ${MONGO_DATABASE:commercemesh}
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:rootroot}
  cache:
    type: redis
    redis:
      time-to-live: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

springdoc:
  swagger-ui:
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
