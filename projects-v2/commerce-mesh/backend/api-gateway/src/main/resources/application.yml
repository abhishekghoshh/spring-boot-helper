server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: authentication-service
              uri: lb://authentication-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: product-catalog-service
              uri: lb://product-catalog-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**,/api/v1/wishlist/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/v1/search/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  metrics:
    export:
      prometheus:
        enabled: true
