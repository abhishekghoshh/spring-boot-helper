server:
  port: ${DISCOVERY_SERVER_PORT:8761}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: true
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
