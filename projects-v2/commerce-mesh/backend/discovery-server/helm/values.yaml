replicaCount: 2

image:
  repository: commercemesh/REPLACE_ME
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelay: 30
  readiness:
    path: /actuator/health/readiness
    initialDelay: 15
  startup:
    path: /actuator/health
    initialDelay: 10
    failureThreshold: 30

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false

configmap:
  enabled: true

networkPolicy:
  enabled: true
