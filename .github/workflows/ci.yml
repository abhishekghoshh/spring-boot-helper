name: ci 
on:
  push:
    branches:
      - master 
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - mkdocs.yml
      - requirements.txt
      
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: actions/cache@v6
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force